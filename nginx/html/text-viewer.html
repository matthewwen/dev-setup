<!DOCTYPE html>
<!--
  Buffered text viewer served by /etc/nginx/text.conf.
  Reads a file in chunks with HTTP range requests, so a multi-gigabyte log opens
  as fast as a small one. nginx answers ranges natively for static files.
  Reachable for any path as <path>?view=text.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text</title>
<script>
  document.documentElement.dataset.theme = localStorage.getItem("md-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>&#128462;</text></svg>">
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --bg-soft: #f6f8fa;
  --bg-inset: #f0f3f6;
  --fg: #1f2328;
  --fg-muted: #636c76;
  --border: #d7dde3;
  --link: #0a58ca;
  --mark: #ffd33d;
  --del: #cf222e;
  --ok: #1a7f37;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
html[data-theme="dark"] {
  --bg: #0d1117;
  --bg-soft: #161b22;
  --bg-inset: #1c2128;
  --fg: #e6edf3;
  --fg-muted: #8b949e;
  --border: #30363d;
  --link: #6cb6ff;
  --mark: #9e6a03;
  --del: #ff7b72;
  --ok: #3fb950;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }

header {
  flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 9px 14px; border-bottom: 1px solid var(--border);
}
#crumbs {
  flex: 1 1 260px; min-width: 0;
  font-family: var(--mono); font-size: 13px; color: var(--fg-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#crumbs b { color: var(--fg); }
.btn {
  flex: 0 0 auto; padding: 5px 10px; font-size: 12px;
  color: var(--fg); background: var(--bg-soft);
  border: 1px solid var(--border); border-radius: 7px; cursor: pointer;
}
.btn:hover { background: var(--bg-inset); text-decoration: none; }
.btn.on { color: #fff; background: var(--link); border-color: var(--link); }
#find {
  flex: 0 1 200px; padding: 5px 9px;
  font-family: var(--mono); font-size: 12px;
  color: var(--fg); background: var(--bg-soft);
  border: 1px solid var(--border); border-radius: 7px;
}

main { flex: 1 1 auto; overflow: auto; min-height: 0; }
#body {
  margin: 0; padding: 10px 0 60px;
  font-family: var(--mono); font-size: 12.5px; line-height: 1.55;
}
.ln { display: flex; }
.ln:hover { background: var(--bg-soft); }
.ln .no {
  flex: 0 0 68px; padding-right: 12px; text-align: right;
  color: var(--fg-muted); user-select: none;
}
.ln .tx { flex: 1 1 auto; white-space: pre; overflow-x: hidden; }
body.wrap .ln .tx { white-space: pre-wrap; word-break: break-word; }
#more { padding: 14px; text-align: center; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }

footer {
  flex: 0 0 auto; display: flex; gap: 14px; align-items: center;
  padding: 5px 14px; font-size: 12px; color: var(--fg-muted);
  background: var(--bg-soft); border-top: 1px solid var(--border);
}
footer .spacer { flex: 1 1 auto; }
.bar {
  flex: 0 0 160px; height: 6px; border-radius: 3px;
  background: var(--bg-inset); overflow: hidden;
}
.bar span { display: block; height: 100%; background: var(--ok); width: 0; }
.card {
  margin: 14px; padding: 14px; font-size: 13px;
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px;
}
.card.bad { color: var(--del); }
kbd {
  font-family: var(--mono); font-size: 11px; padding: 1px 5px;
  background: var(--bg-inset); border: 1px solid var(--border); border-radius: 4px;
}
</style>
</head>
<body>
<header>
  <div id="crumbs"></div>
  <input id="find" type="search" placeholder="find in loaded text" spellcheck="false">
  <span id="hits" style="font-size:12px;color:var(--fg-muted)"></span>
  <button class="btn" id="moreBtn">Load more</button>
  <button class="btn" id="tailBtn">End</button>
  <button class="btn" id="wrapBtn">Wrap</button>
  <button class="btn" id="themeBtn">&#9788;</button>
  <a class="btn" id="rawBtn">Raw</a>
</header>
<main id="scroller">
  <div id="body">Loading&hellip;</div>
  <div id="more"></div>
</main>
<footer>
  <span id="status"></span>
  <div class="bar"><span id="barFill"></span></div>
  <span class="spacer"></span>
  <span><kbd>/</kbd> find · <kbd>G</kbd> end · <kbd>g</kbd> start · <kbd>w</kbd> wrap</span>
</footer>
<script>
"use strict";

const CHUNK = 256 * 1024;          // bytes per range request
const TAIL_BYTES = 1024 * 1024;    // window loaded by the End button

const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const el = id => document.getElementById(id);
const path = decodeURIComponent(location.pathname);
const src = path + "?raw=1";
document.title = path.split("/").pop();

(function crumbs() {
  const parts = path.split("/").filter(Boolean);
  let acc = "";
  const bits = ['<a href="/">/</a>'];
  parts.forEach((p, i) => {
    acc += "/" + p;
    bits.push(i === parts.length - 1 ? "<b>" + esc(p) + "</b>" : '<a href="' + acc + '/">' + esc(p) + "</a>");
  });
  el("crumbs").innerHTML = bits.join("<span> &rsaquo; </span>");
})();

el("rawBtn").href = src;
el("themeBtn").onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("md-theme", next);
};
el("wrapBtn").onclick = () => {
  document.body.classList.toggle("wrap");
  el("wrapBtn").classList.toggle("on", document.body.classList.contains("wrap"));
};

const state = {
  total: null,      // file size in bytes, null until known
  next: 0,          // next byte to read in head mode
  line: 1,          // line number of the next line to print
  tail: false,      // true once the End button loads the last window
  partial: "",      // trailing fragment of an incomplete line
  done: false,
  busy: false,
};
const decoder = new TextDecoder("utf-8");
const body = el("body");
const scroller = el("scroller");

function human(bytes) {
  const units = ["B", "KiB", "MiB", "GiB", "TiB"];
  let i = 0, n = bytes;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(1)) + " " + units[i];
}

function report() {
  const read = state.tail ? state.total - state.tailFrom : state.next;
  const pct = state.total ? Math.min(100, (read / state.total) * 100) : 0;
  el("barFill").style.width = pct.toFixed(1) + "%";
  el("status").textContent = [
    state.tail ? "tail" : "from start",
    human(read) + " of " + (state.total === null ? "?" : human(state.total)),
    state.done ? "complete" : Math.round(pct) + "%",
  ].join("  ·  ");
  el("moreBtn").disabled = state.done || state.busy;
}

// One range request. Returns the decoded text, and learns the total size from
// the Content-Range header that nginx sends with a 206.
async function readRange(from, to) {
  const headers = { Range: from === null ? "bytes=-" + to : "bytes=" + from + "-" + to };
  const r = await fetch(src, { headers, cache: "no-store" });
  if (!r.ok && r.status !== 206) throw new Error(r.status + " " + r.statusText);
  const cr = r.headers.get("Content-Range");
  if (cr) {
    const total = Number(cr.split("/")[1]);
    if (!Number.isNaN(total)) state.total = total;
  } else if (r.headers.get("Content-Length") && state.total === null) {
    // The server ignored the range and sent the whole file.
    state.total = Number(r.headers.get("Content-Length"));
  }
  const buf = await r.arrayBuffer();
  return { text: decoder.decode(buf, { stream: true }), bytes: buf.byteLength, ranged: Boolean(cr) };
}

function appendLines(text, numbered) {
  const combined = state.partial + text;
  const lines = combined.split("\n");
  state.partial = state.done ? "" : lines.pop();
  if (!lines.length) return;
  const html = lines.map(line =>
    '<div class="ln"><span class="no">' + (numbered ? state.line++ : "") + "</span>" +
    '<span class="tx">' + esc(line) + "</span></div>").join("");
  body.insertAdjacentHTML("beforeend", html);
}

async function loadMore() {
  if (state.busy || state.done) return;
  state.busy = true;
  report();
  try {
    const to = state.next + CHUNK - 1;
    const { text, bytes, ranged } = await readRange(state.next, to);
    if (body.textContent === "Loading…") body.textContent = "";
    state.next += bytes;
    if (!ranged || bytes < CHUNK || (state.total !== null && state.next >= state.total)) state.done = true;
    appendLines(text, true);
    if (state.done && state.partial) { appendLines("", true); }
  } catch (err) {
    body.insertAdjacentHTML("beforeend",
      '<div class="card bad">' + esc(err.message || String(err)) + "</div>");
    state.done = true;
  }
  state.busy = false;
  report();
  runFind();
}

// The last window of the file, for logs where only the end matters. Line
// numbers are unknown in this mode, so the gutter stays empty.
async function loadTail() {
  if (state.busy) return;
  state.busy = true;
  try {
    const { text, bytes } = await readRange(null, TAIL_BYTES);
    state.tail = true;
    state.done = true;
    state.partial = "";
    state.tailFrom = state.total === null ? 0 : Math.max(0, state.total - bytes);
    body.innerHTML = state.tailFrom > 0
      ? '<div class="card">Showing the last ' + human(bytes) + " of " + human(state.total) +
        '. <a href="#" id="fromStart">Read from the start</a> for line numbers.</div>'
      : "";
    appendLines(text, false);
    const link = el("fromStart");
    if (link) link.onclick = e => { e.preventDefault(); restart(); };
  } catch (err) {
    body.insertAdjacentHTML("beforeend", '<div class="card bad">' + esc(err.message || String(err)) + "</div>");
  }
  state.busy = false;
  report();
  scroller.scrollTop = scroller.scrollHeight;
}

function restart() {
  Object.assign(state, { next: 0, line: 1, tail: false, partial: "", done: false, busy: false });
  body.innerHTML = "";
  scroller.scrollTop = 0;
  loadMore();
}

el("moreBtn").onclick = loadMore;
el("tailBtn").onclick = loadTail;

// Keep reading while the reader approaches the bottom.
scroller.addEventListener("scroll", () => {
  if (state.done || state.busy || state.tail) return;
  if (scroller.scrollTop + scroller.clientHeight > scroller.scrollHeight - 600) loadMore();
});

/* ============================== find ============================== */

const find = el("find");
let findTimer;
find.addEventListener("input", () => {
  clearTimeout(findTimer);
  findTimer = setTimeout(runFind, 120);
});

function runFind() {
  const q = find.value;
  body.querySelectorAll("mark").forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  if (!q) { el("hits").textContent = ""; return; }
  const needle = q.toLowerCase();
  let hits = 0, first = null;
  body.querySelectorAll(".tx").forEach(span => {
    const text = span.textContent;
    const at = text.toLowerCase().indexOf(needle);
    if (at < 0) return;
    hits++;
    span.innerHTML = esc(text.slice(0, at)) + "<mark>" + esc(text.slice(at, at + q.length)) +
      "</mark>" + esc(text.slice(at + q.length));
    if (!first) first = span;
  });
  el("hits").textContent = hits ? hits + (hits === 1 ? " line" : " lines") : "no match";
  if (first) first.scrollIntoView({ block: "center" });
}

addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); find.focus(); find.select(); return; }
  if (typing) { if (e.key === "Escape") { find.value = ""; runFind(); find.blur(); } return; }
  if (e.key === "G") { loadTail(); e.preventDefault(); }
  else if (e.key === "g") { scroller.scrollTop = 0; e.preventDefault(); }
  else if (e.key === "w") { el("wrapBtn").click(); e.preventDefault(); }
});

loadMore();
</script>
</body>
</html>
