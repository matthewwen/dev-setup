# JSON rendering.
#
# Included inside a `server { }` block, before inspect.conf so that this block
# owns .json. A browser navigation to a .json, .jsonl, or .ndjson file
# rewrites to the app shell. Every other client, including fetch() from the
# Inspect viewer, gets the raw bytes.
#
# Add ?raw=1 to read the source.

location ~* \.(json|jsonl|ndjson)$ {
    types {
        application/json     json;
        application/x-ndjson jsonl ndjson;
    }
    default_type application/json;
    charset utf-8;
    add_header Content-Disposition inline always;
    add_header Cache-Control no-store always;

    if ($render_page) {
        rewrite ^ /__app/index.html last;
    }
}
