# Main config template. install.sh fills the @...@ fields and writes the result
# to <conf dir>/nginx.conf. See scripts/platform.sh for how they are derived.

@USER_DIRECTIVE@
worker_processes auto;

error_log @LOG_DIR@/error.log notice;
pid @PID_PATH@;

@MODULES_INCLUDE@

events {
    worker_connections 1024;
}

http {
    @TEMP_PATHS@
    include dev-setup/conf/maps.conf;
    include dev-setup/conf/hosts.conf;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log @LOG_DIR@/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # The site is often reached over an SSH tunnel, where bytes cost more than CPU.
    # gzip_proxied also compresses the JSON from the explorer API.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/javascript text/css application/json
               text/markdown text/plain image/svg+xml;

    types_hash_max_size 4096;

    include mime.types;
    default_type text/plain;

    server {
        listen @PORT@ default_server;
        listen [::]:@PORT@ default_server;
        server_name _;

        root @WEBROOT@;

        # Send redirects as a path, never as http://host/path. nginx builds the
        # absolute form from $server_port, which drops the port when the site is
        # reached through a tunnel or another port.
        absolute_redirect off;

        include dev-setup/conf/explorer.conf;
        include dev-setup/conf/prompts.conf;
        include dev-setup/conf/md.conf;
        include dev-setup/conf/json.conf;
        include dev-setup/conf/ipynb.conf;
        include dev-setup/conf/text.conf;
        include dev-setup/conf/inspect.conf;

        location / {
            add_header Content-Disposition inline always;
            add_header Cache-Control no-store always;

            # A directory falls through to the `index` fallback in
            # explorer.conf, which serves the explorer for that path.
            try_files $uri $uri/ =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
        }
    }
}
