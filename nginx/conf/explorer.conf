# File explorer and search — the listing for every directory.
#
# Included inside a `server { }` block. Any directory URL returns the explorer,
# so http://localhost/example/ is the explorer showing that
# directory. The page reads its path from location.pathname.
#
# nginx cannot template its own autoindex output, so the explorer replaces it.
# The plain listing stays reachable under /__raw/, which also serves raw bytes
# for any file and keeps the tree browsable when the API is down.
#
# The UI is static; the API is scripts/explorer-server.py on 127.0.0.1:7576,
# started by `nginx/scripts/explorer.sh start`.

# A directory serves its own index.html when it has one, which the Inspect
# embedded viewer needs. Everything else falls back to the explorer.
index index.html /__explorer.html;

# Serving path for the page. nginx appends the `index` file to an alias when the
# URI ends in a slash, so the page needs a URI that does not.
location = /__explorer.html {
    internal;
    alias @NGINX_DIR@/explorer.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control no-cache always;
}

# The explorer used to live at /__files, and search at /__search. One page now.
location ~ ^/__(files|search)(/.*)?$ {
    return 301 /;
}

# Plain nginx index plus raw bytes, for any path: /__raw/scratch/notes.md
location ^~ /__raw/ {
    alias @WEBROOT@/;

    # Raw mode always lists. This name matches no file, so autoindex answers
    # instead of the explorer fallback above.
    index .no-index;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    default_type text/plain;
    add_header Content-Disposition inline always;
    add_header Cache-Control no-store always;

    sub_filter '<h1>Index of /__raw' '<p style="font:13px sans-serif"><a href="/">&#8598; back to the file explorer</a></p><h1>Index of ';
    sub_filter_once on;
}

location ^~ /__api/ {
    proxy_pass http://127.0.0.1:7576/api/;
    include proxy-dev.conf;

    # Answer with JSON when the service is down so the UI can explain it.
    proxy_intercept_errors on;
    error_page 502 503 504 = @explorer_down;
}

location @explorer_down {
    default_type application/json;
    return 200 '{"ok":false,"error":"search service is unreachable"}';
}
