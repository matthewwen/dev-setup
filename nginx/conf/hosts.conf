# Host-based routes. Uncomment and adapt the example below for a local app.
#
# Included directly inside the `http { }` block of nginx.conf. Match the
# `listen` port to the one in nginx.conf (80 on Linux, 8080 with Homebrew).

# server {
#     listen 80;
#     listen [::]:80;
#     server_name app.localhost;
#
#     location / {
#         proxy_pass http://127.0.0.1:8000;
#         include proxy-dev.conf;
#     }
# }
