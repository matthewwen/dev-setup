<!DOCTYPE html>
<!--
  File explorer served by /etc/nginx/explorer.conf at http://localhost/.
  Browses the webroot through /__api/list and searches it through /__api/search,
  both proxied to scripts/explorer-server.py.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Files</title>
<script>
  document.documentElement.dataset.theme = localStorage.getItem("md-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>&#128193;</text></svg>">
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --bg-soft: #f6f8fa;
  --bg-inset: #f0f3f6;
  --fg: #1f2328;
  --fg-muted: #636c76;
  --border: #d7dde3;
  --link: #0a58ca;
  --sel: #dbe9ff;
  --mark: #ffd33d;
  --del: #cf222e;
  --dir: #b1560f;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
html[data-theme="dark"] {
  --bg: #0d1117;
  --bg-soft: #161b22;
  --bg-inset: #1c2128;
  --fg: #e6edf3;
  --fg-muted: #8b949e;
  --border: #30363d;
  --link: #6cb6ff;
  --sel: #1f3a5f;
  --mark: #9e6a03;
  --del: #ff7b72;
  --dir: #e3b341;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ------------------------------- toolbar ------------------------------- */
header { flex: 0 0 auto; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.row { display: flex; gap: 8px; align-items: center; }
.row + .row { margin-top: 8px; }
#crumbs {
  flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline;
  font-family: var(--mono); font-size: 13px; color: var(--fg-muted);
}
#crumbs a { padding: 1px 3px; border-radius: 4px; }
#crumbs b { padding: 1px 3px; color: var(--fg); }
#crumbs span { color: var(--border); }
#q {
  flex: 1 1 320px; min-width: 160px; padding: 7px 11px;
  font-family: var(--mono); font-size: 13px;
  color: var(--fg); background: var(--bg-soft);
  border: 1px solid var(--border); border-radius: 8px;
}
#q:focus { outline: 2px solid var(--link); outline-offset: -1px; }
.seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button {
  padding: 6px 10px; font-size: 12px; font-family: var(--sans);
  color: var(--fg-muted); background: var(--bg-soft); border: 0; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { color: #fff; background: var(--link); }
.btn {
  flex: 0 0 auto; padding: 6px 10px; font-size: 12px;
  color: var(--fg); background: var(--bg-soft);
  border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
}
.btn:hover { background: var(--bg-inset); text-decoration: none; }
.btn.on { color: #fff; background: var(--link); border-color: var(--link); }
.hint { font-size: 12px; color: var(--fg-muted); }
label.chk { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--fg-muted); cursor: pointer; }
.row2 input[type="text"] {
  width: 140px; padding: 4px 8px; font-family: var(--mono); font-size: 12px;
  color: var(--fg); background: var(--bg-soft);
  border: 1px solid var(--border); border-radius: 6px;
}

/* -------------------------------- panes -------------------------------- */
main { flex: 1 1 auto; display: flex; min-height: 0; }
#tree {
  flex: 0 0 240px; overflow: auto; padding: 8px 4px 40px;
  background: var(--bg-soft); border-right: 1px solid var(--border);
  font-family: var(--mono); font-size: 12.5px;
}
#tree.hidden { display: none; }
.tnode { padding-left: 12px; }
.trow {
  display: flex; gap: 4px; align-items: center;
  padding: 2px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap;
}
.trow:hover { background: var(--bg-inset); }
.trow.here { background: var(--sel); color: var(--fg); }
.tw { width: 10px; flex: 0 0 auto; color: var(--fg-muted); }
.tname { overflow: hidden; text-overflow: ellipsis; }

#list { flex: 1 1 auto; overflow: auto; min-width: 0; }
#preview {
  flex: 0 0 46%; min-width: 0; display: none;
  border-left: 1px solid var(--border); background: var(--bg-soft);
}
#preview.on { display: flex; flex-direction: column; }
#preview .phead {
  display: flex; gap: 8px; align-items: center;
  padding: 6px 10px; border-bottom: 1px solid var(--border);
  font-family: var(--mono); font-size: 12px; color: var(--fg-muted);
}
#preview .phead .pname { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
#preview iframe { flex: 1 1 auto; width: 100%; border: 0; background: var(--bg); }

/* -------------------------------- table -------------------------------- */
table { width: 100%; border-collapse: collapse; }
thead th {
  position: sticky; top: 0; z-index: 2;
  padding: 6px 12px; text-align: left; font-size: 11px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase;
  color: var(--fg-muted); background: var(--bg);
  border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
}
thead th.num { text-align: right; }
tbody td {
  padding: 4px 12px; border-bottom: 1px solid var(--bg-inset);
  font-size: 13px; white-space: nowrap;
}
tbody td.name { font-family: var(--mono); max-width: 0; width: 60%; overflow: hidden; text-overflow: ellipsis; }
tbody td.num { text-align: right; font-family: var(--mono); font-size: 12px; color: var(--fg-muted); }
tbody td.when { font-size: 12px; color: var(--fg-muted); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--bg-soft); }
tbody tr.sel { background: var(--sel); }
.ico { display: inline-block; width: 18px; }
.dirname { color: var(--dir); font-weight: 600; }
.lnk::after { content: " ↗"; color: var(--fg-muted); font-size: 11px; }

/* ------------------------------- results ------------------------------- */
#results { padding: 12px 14px 60px; }
.file { margin-bottom: 12px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.file.sel { border-color: var(--link); }
.fhead {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline;
  padding: 7px 11px; background: var(--bg-inset); border-bottom: 1px solid var(--border);
}
.fhead .fname { font-family: var(--mono); font-size: 13px; font-weight: 600; }
.fhead .fdir { font-family: var(--mono); font-size: 11px; color: var(--fg-muted); }
.fhead .spacer { flex: 1 1 auto; }
.fhead .fmeta { font-size: 11px; color: var(--fg-muted); }
.line { display: flex; gap: 10px; padding: 2px 11px; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
.line:hover { background: var(--bg-inset); }
.line .no { flex: 0 0 46px; text-align: right; color: var(--fg-muted); user-select: none; }
.empty { padding: 8px 11px; font-size: 12px; color: var(--fg-muted); }
mark { background: var(--mark); color: inherit; border-radius: 2px; }

footer {
  flex: 0 0 auto; display: flex; gap: 14px; align-items: center;
  padding: 5px 14px; font-size: 12px; color: var(--fg-muted);
  background: var(--bg-soft); border-top: 1px solid var(--border);
}
footer .spacer { flex: 1 1 auto; }
.card { margin: 14px; padding: 14px; font-size: 13px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px; }
.card.bad { color: var(--del); }
.card pre { margin: 8px 0 0; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }
kbd { font-family: var(--mono); font-size: 11px; padding: 1px 5px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: 4px; }
</style>
</head>
<body>
<header>
  <div class="row">
    <button class="btn" id="treeBtn" title="Toggle the tree">&#9776;</button>
    <button class="btn" id="upBtn" title="Parent directory">&#8593;</button>
    <div id="crumbs"></div>
    <button class="btn" id="previewBtn" title="Preview pane (p)">Preview</button>
    <button class="btn" id="themeBtn" title="Theme">&#9788;</button>
    <a class="btn" id="indexLink" title="Plain nginx index and raw bytes">Raw</a>
  </div>
  <div class="row row2">
    <input id="q" type="search" placeholder="Filter this directory — press Enter to search contents" spellcheck="false">
    <div class="seg" id="mode">
      <button data-mode="content" class="on">Content</button>
      <button data-mode="names">Names</button>
      <button data-mode="both">Both</button>
    </div>
    <label class="chk"><input id="here" type="checkbox" checked> this subtree</label>
    <label>glob <input id="glob" type="text" placeholder="*.md,*.yaml" spellcheck="false"></label>
    <label class="chk"><input id="regex" type="checkbox"> regex</label>
    <label class="chk"><input id="case" type="checkbox"> case</label>
    <label class="chk"><input id="hidden" type="checkbox"> hidden</label>
    <span class="spacer"></span>
  </div>
</header>

<main>
  <nav id="tree"></nav>
  <section id="list"></section>
  <aside id="preview">
    <div class="phead">
      <span class="pname"></span>
      <a class="btn" target="_blank" id="pOpen">Open</a>
      <button class="btn" id="pClose">&times;</button>
    </div>
    <iframe id="pFrame" title="preview"></iframe>
  </aside>
</main>

<footer>
  <span id="status"></span>
  <span class="spacer"></span>
  <span class="hint"><kbd>/</kbd> search · <kbd>j</kbd><kbd>k</kbd> move · <kbd>Enter</kbd> open · <kbd>p</kbd> preview · <kbd>u</kbd> up · <kbd>r</kbd> refresh · <kbd>Esc</kbd> clear</span>
</footer>

<script>
"use strict";

const API = "/__api";
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const el = id => document.getElementById(id);

const ui = {
  q: el("q"), glob: el("glob"), regex: el("regex"), case: el("case"),
  hidden: el("hidden"), here: el("here"),
  tree: el("tree"), list: el("list"), status: el("status"), crumbs: el("crumbs"),
  preview: el("preview"), pFrame: el("pFrame"), pName: el("preview").querySelector(".pname"),
  pOpen: el("pOpen"),
};

const state = {
  path: "/",            // current directory, webroot relative, always leading slash
  entries: [],          // current listing
  sort: { key: "name", dir: 1 },
  mode: "content",
  view: "list",         // list | results
  results: null,
  selected: -1,
  filter: "",
};

/* =============================== helpers =============================== */

const EXT_ICON = {
  md: "📝", markdown: "📝", txt: "📄", log: "🪵",
  json: "🔢", jsonl: "🔢", ndjson: "🔢", yaml: "⚙️", yml: "⚙️", toml: "⚙️", conf: "⚙️", ini: "⚙️",
  py: "🐍", sh: "🐚", bash: "🐚", zsh: "🐚", js: "📜", mjs: "📜", ts: "📜", html: "🌐", css: "🎨",
  png: "🖼️", jpg: "🖼️", jpeg: "🖼️", gif: "🖼️", svg: "🖼️", pdf: "📕",
  eval: "🧪", zip: "🗜️", tar: "🗜️", gz: "🗜️", csv: "📊", tsv: "📊", parquet: "📊",
  safetensors: "🧠", bin: "🧠", pt: "🧠",
};
const icon = e => e.type === "dir" ? "📁" : (EXT_ICON[e.ext] || "📄");

function human(bytes) {
  const units = ["B", "K", "M", "G", "T"];
  let i = 0, n = bytes;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(1)) + units[i];
}

function when(ts) {
  if (!ts) return "";
  const d = new Date(ts * 1000);
  const days = (Date.now() - d) / 86400000;
  if (days < 1) return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (days < 300) return d.toLocaleDateString([], { month: "short", day: "numeric" });
  return d.toLocaleDateString([], { year: "numeric", month: "short" });
}

// Viewer-backed types open in the browser; the rest are raw downloads.
const RENDERED = /\.(md|markdown|mdx|json|jsonl|ndjson|eval|html|htm|txt|log|out|err|yaml|yml|png|jpe?g|gif|svg|pdf|csv|tsv)$/i;
const previewable = url => RENDERED.test(url);

function offline() {
  ui.list.innerHTML = '<div class="card bad">The explorer service is not running.' +
    "<pre>" + esc("nginx/scripts/explorer.sh start") + "</pre></div>";
  ui.status.textContent = "offline";
}

async function api(endpoint, params) {
  const r = await fetch(API + endpoint + "?" + new URLSearchParams(params).toString(), { cache: "no-store" });
  return r.json();
}

// Listings are cached briefly so Back, Forward, and revisits paint with no
// round trip. `r` refreshes, and any listing older than TTL is refetched.
const CACHE_TTL_MS = 10000;
const listCache = new Map();

async function listing(path, opts) {
  const wantTree = !(opts && opts.noTree);
  const key = path + (wantTree ? "|tree" : "");
  const hit = listCache.get(key);
  if (hit && !(opts && opts.force) && Date.now() - hit.at < CACHE_TTL_MS) return hit.data;
  const params = { path };
  if (wantTree) params.tree = "1";
  const data = await api("/list", params);
  if (data.ok) listCache.set(key, { data, at: Date.now() });
  return data;
}

// Warm the cache for a directory the pointer is resting on.
let prefetchTimer;
function prefetch(path) {
  clearTimeout(prefetchTimer);
  prefetchTimer = setTimeout(() => {
    if (!listCache.has(path + "|tree")) listing(path).catch(() => {});
  }, 120);
}

/* ================================ routing ================================ */

// The directory is the URL path, so /example/ opens that
// directory directly. Search options ride in the query string.
const dirUrl = path => (path === "/" ? "/" : path + "/");

function writeUrl(push) {
  const p = new URLSearchParams();
  if (state.view === "results") {
    p.set("q", ui.q.value.trim());
    p.set("mode", state.mode);
    if (!ui.here.checked) p.set("all", "1");
    if (ui.glob.value.trim()) p.set("glob", ui.glob.value.trim());
    if (ui.regex.checked) p.set("regex", "1");
    if (ui.case.checked) p.set("case", "1");
  }
  const query = p.toString();
  const url = dirUrl(state.path) + (query ? "?" + query : "");
  if (push && url !== location.pathname + location.search) history.pushState(null, "", url);
  else history.replaceState(null, "", url);
}

function readUrl() {
  const p = new URLSearchParams(location.search);
  // #p=/dir is the old link format; honour it once, then use the path.
  const legacy = new URLSearchParams(location.hash.slice(1));
  state.path = (legacy.get("p") || decodeURIComponent(location.pathname)).replace(/\/+$/, "") || "/";
  state.mode = p.get("mode") || legacy.get("mode") || "content";
  ui.glob.value = p.get("glob") || "";
  ui.regex.checked = p.get("regex") === "1";
  ui.case.checked = p.get("case") === "1";
  ui.here.checked = p.get("all") !== "1";
  el("mode").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.mode === state.mode));
  const q = p.get("q") || legacy.get("q") || "";
  ui.q.value = q;
  return q;
}

/* ============================== directory ============================== */

async function open(path, opts) {
  const keepQuery = opts && opts.keepQuery;
  const push = !(opts && opts.replace);
  state.path = decodeURIComponent(path).replace(/\/+$/, "") || "/";
  state.view = "list";
  state.selected = -1;
  if (!keepQuery) { ui.q.value = ""; state.filter = ""; }
  let data;
  try {
    data = await listing(state.path, { force: opts && opts.force });
  } catch (err) {
    offline();
    return;
  }
  if (!data.ok) {
    ui.list.innerHTML = '<div class="card bad">' + esc(data.error || "cannot list") + "</div>";
    return;
  }
  state.entries = data.entries;
  state.counts = { dirs: data.dirs, files: data.files };
  state.parent = data.parent;
  paintCrumbs();
  paintList();
  writeUrl(push);
  el("indexLink").href = "/__raw" + dirUrl(state.path);
  applyTree(data.tree);
  if (data.ripgrep === false) ui.status.textContent += "  ·  ripgrep missing: content search unavailable";
}

function paintCrumbs() {
  const parts = state.path.split("/").filter(Boolean);
  let acc = "";
  const bits = ['<a href="#" data-go="/">webroot</a>'];
  parts.forEach((name, i) => {
    acc += "/" + name;
    bits.push(i === parts.length - 1
      ? "<b>" + esc(name) + "</b>"
      : '<a href="#" data-go="' + esc(acc) + '">' + esc(name) + "</a>");
  });
  ui.crumbs.innerHTML = bits.join("<span> / </span>");
}

function visibleEntries() {
  let rows = state.entries;
  if (!ui.hidden.checked) rows = rows.filter(e => !e.hidden);
  if (state.filter) {
    const f = state.filter.toLowerCase();
    rows = rows.filter(e => e.name.toLowerCase().includes(f));
  }
  const { key, dir } = state.sort;
  const cmp = {
    name: (a, b) => a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1,
    size: (a, b) => a.size - b.size,
    mtime: (a, b) => a.mtime - b.mtime,
  }[key];
  // Directories stay grouped ahead of files under every sort.
  return [...rows].sort((a, b) =>
    (a.type === b.type ? cmp(a, b) * dir : (a.type === "dir" ? -1 : 1)));
}

// Rows land in chunks so a directory with thousands of entries paints its first
// screen immediately instead of blocking on one huge innerHTML.
const FIRST_CHUNK = 200;
const CHUNK = 400;
let chunkHandle = 0;

function rowHtml(e, i, rx) {
  return '<tr data-i="' + i + '">' +
    '<td class="name"><span class="ico">' + icon(e) + "</span>" +
    '<span class="' + (e.type === "dir" ? "dirname" : "") + (e.link ? " lnk" : "") + '">' +
    mark(e.name, rx) + "</span></td>" +
    '<td class="num">' + (e.type === "dir" ? "\u2014" : human(e.size)) + "</td>" +
    '<td class="when">' + when(e.mtime) + "</td></tr>";
}

function paintList() {
  cancelAnimationFrame(chunkHandle);
  const rows = visibleEntries();
  state.rows = rows;
  const arrow = k => state.sort.key === k ? (state.sort.dir > 0 ? " \u25b2" : " \u25bc") : "";
  const head = '<thead><tr>' +
    '<th data-sort="name">Name' + arrow("name") + "</th>" +
    '<th class="num" data-sort="size">Size' + arrow("size") + "</th>" +
    '<th class="when" data-sort="mtime">Modified' + arrow("mtime") + "</th></tr></thead>";

  const up = state.parent === null ? "" :
    '<tr data-up="1"><td class="name"><span class="ico">\u21a9</span>..</td><td class="num"></td><td class="when"></td></tr>';

  const rx = state.filter
    ? new RegExp(state.filter.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi") : null;
  const first = rows.slice(0, FIRST_CHUNK).map((e, i) => rowHtml(e, i, rx)).join("");

  ui.list.innerHTML = "<table>" + head + "<tbody>" + up + first + "</tbody></table>" +
    (rows.length ? "" : '<div class="card">Nothing here' + (state.filter ? " matches the filter." : ".") + "</div>");

  const tbody = ui.list.querySelector("tbody");
  if (tbody && rows.length > FIRST_CHUNK) appendChunk(tbody, rows, FIRST_CHUNK, rx);
  else cacheRows();

  ui.status.textContent = [
    state.counts.dirs + " dir" + (state.counts.dirs === 1 ? "" : "s"),
    state.counts.files + " file" + (state.counts.files === 1 ? "" : "s"),
    state.filter ? rows.length + " shown" : "",
  ].filter(Boolean).join("  \u00b7  ");
}

function appendChunk(tbody, rows, from, rx) {
  chunkHandle = requestAnimationFrame(() => {
    const slice = rows.slice(from, from + CHUNK);
    tbody.insertAdjacentHTML("beforeend", slice.map((e, k) => rowHtml(e, from + k, rx)).join(""));
    if (from + CHUNK < rows.length) appendChunk(tbody, rows, from + CHUNK, rx);
    else cacheRows();
  });
}

// Keyboard movement reuses these handles instead of re-querying the DOM.
function cacheRows() {
  state.nodes = [...ui.list.querySelectorAll("tbody tr[data-i]")];
}

/* ================================= tree ================================= */

const nodeHtml = e =>
  '<div class="tnode" data-open="0"><div class="trow" data-tpath="' + esc("/" + e.path) + '">' +
  '<span class="tw">\u25b8</span><span class="tname">' + esc(e.name) + "</span></div>" +
  '<div class="tkids"></div></div>';

// The listing response carries a dirs-only level for the webroot and for every
// ancestor of the current directory, so the whole sidebar paints from one
// request instead of one request per level.
function applyTree(levels) {
  if (!levels || !levels.length) { markTree(); return; }
  ui.tree.innerHTML = '<div class="tnode" data-open="1"><div class="trow" data-tpath="/">' +
    '<span class="tw">\u25be</span><span class="tname">\ud83d\udcc1 webroot</span></div>' +
    '<div class="tkids"></div></div>';
  let holder = ui.tree.querySelector(".tkids");
  for (let i = 0; i < levels.length; i++) {
    holder.innerHTML = levels[i].entries.map(nodeHtml).join("");
    treeCache.set(levels[i].path, levels[i].entries);
    const next = levels[i + 1];
    if (!next) break;
    const row = [...holder.children].map(n => n.firstElementChild)
      .find(r => r && r.dataset.tpath === next.path);
    if (!row) break;
    row.parentElement.dataset.open = "1";
    row.querySelector(".tw").textContent = "\u25be";
    holder = row.parentElement.querySelector(":scope > .tkids");
  }
  markTree();
}

const treeCache = new Map();

async function treeChildren(path) {
  if (treeCache.has(path)) return treeCache.get(path);
  try {
    const data = await listing(path, { noTree: true });
    const kids = data.ok ? data.entries.filter(e => e.type === "dir") : [];
    treeCache.set(path, kids);
    return kids;
  } catch (err) {
    return [];
  }
}

async function toggleTreeNode(row) {
  const node = row.parentElement;
  const kids = node.querySelector(":scope > .tkids");
  if (node.dataset.open === "1") {
    node.dataset.open = "0";
    kids.innerHTML = "";
    row.querySelector(".tw").textContent = "\u25b8";
    return;
  }
  const children = await treeChildren(row.dataset.tpath);
  kids.innerHTML = children.map(nodeHtml).join("");
  node.dataset.open = "1";
  row.querySelector(".tw").textContent = "\u25be";
}

function markTree() {
  ui.tree.querySelectorAll(".trow").forEach(r =>
    r.classList.toggle("here", r.dataset.tpath === state.path));
}

ui.tree.addEventListener("click", async e => {
  const row = e.target.closest(".trow");
  if (!row) return;
  if (e.target.classList.contains("tw")) { await toggleTreeNode(row); return; }
  open(row.dataset.tpath);
});

ui.tree.addEventListener("pointerover", e => {
  const row = e.target.closest(".trow");
  if (row) prefetch(row.dataset.tpath);
});

/* ================================ search ================================ */

async function search(opts) {
  const q = ui.q.value.trim();
  if (!q) { open(state.path); return; }
  state.view = "results";
  state.selected = -1;
  ui.status.textContent = "searching…";
  writeUrl(!(opts && opts.replace));

  const params = { q, mode: state.mode };
  if (ui.here.checked && state.path !== "/") params.scope = state.path;
  if (ui.glob.value.trim()) params.glob = ui.glob.value.trim();
  if (ui.regex.checked) params.regex = "1";
  if (ui.case.checked) params.case = "1";

  let data;
  try {
    data = await api("/search", params);
  } catch (err) {
    offline();
    return;
  }
  if (!data.ok) {
    if (data.error === "search service is unreachable") { offline(); return; }
    ui.list.innerHTML = '<div class="card bad">' + esc(data.error || "search failed") + "</div>";
    ui.status.textContent = "";
    return;
  }
  state.results = data.results;
  paintResults(data, q);
}

function matchRegex(q) {
  try {
    const body = ui.regex.checked ? q : q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return new RegExp(body, ui.case.checked ? "g" : "gi");
  } catch (err) {
    return null;
  }
}

function mark(text, rx) {
  if (!rx) return esc(text);
  rx.lastIndex = 0;
  let out = "", last = 0, m;
  while ((m = rx.exec(text)) !== null) {
    if (m[0] === "") { rx.lastIndex++; continue; }
    out += esc(text.slice(last, m.index)) + "<mark>" + esc(m[0]) + "</mark>";
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

function paintResults(data, q) {
  const rx = matchRegex(q);
  ui.status.textContent = [
    data.count + (data.count === 1 ? " file" : " files"),
    data.matches + (data.matches === 1 ? " match" : " matches"),
    "in " + data.scope,
    data.took_ms + " ms",
    data.truncated ? "truncated" : "",
  ].filter(Boolean).join("  ·  ");

  if (!data.count) {
    ui.list.innerHTML = '<div class="card">No match for <b>' + esc(q) + "</b> in " + esc(data.scope) + ".</div>";
    return;
  }

  ui.list.innerHTML = '<div id="results">' + data.results.map((r, i) => {
    const lines = r.matches.length
      ? r.matches.map(m => '<div class="line"><span class="no">' + m.line + "</span><span>" +
          mark(m.text, rx) + "</span></div>").join("")
      : '<div class="empty">' + (r.size !== undefined ? human(r.size) : "name match") + "</div>";
    return '<div class="file" data-i="' + i + '">' +
      '<div class="fhead"><a class="fname" href="' + esc(r.url) + '">' + mark(r.name, rx) + "</a>" +
      (r.dir ? '<span class="fdir">' + esc(r.dir) + "/</span>" : "") +
      '<span class="spacer"></span>' +
      (r.matches.length ? '<span class="fmeta">' + r.matches.length + " line" +
        (r.matches.length === 1 ? "" : "s") + "</span>" : "") +
      '<a class="fmeta" href="' + esc(r.url) + '?raw=1">raw</a></div>' + lines + "</div>";
  }).join("") + "</div>";
}

/* =============================== preview =============================== */

// A directory previews as its plain nginx index, a file as its viewer or raw.
function showPreview(url, name, isDir) {
  ui.preview.classList.add("on");
  el("previewBtn").classList.add("on");
  ui.pFrame.src = isDir ? url : (previewable(url) ? url : url + "?raw=1");
  ui.pName.textContent = name + (isDir ? "/" : "");
  ui.pOpen.href = url;
}

function hidePreview() {
  ui.preview.classList.remove("on");
  el("previewBtn").classList.remove("on");
  ui.pFrame.src = "about:blank";
}

el("previewBtn").onclick = () => {
  if (ui.preview.classList.contains("on")) { hidePreview(); return; }
  const e = currentEntry();
  if (e) showPreview(e.url, e.name, e.type === "dir");
  else { ui.preview.classList.add("on"); el("previewBtn").classList.add("on"); }
};
el("pClose").onclick = hidePreview;

/* ================================ events ================================ */

ui.list.addEventListener("click", e => {
  const th = e.target.closest("th[data-sort]");
  if (th) {
    const key = th.dataset.sort;
    state.sort = { key, dir: state.sort.key === key ? -state.sort.dir : (key === "name" ? 1 : -1) };
    paintList();
    return;
  }
  if (e.target.closest(".file a")) return;   // let result links navigate
  const fileCard = e.target.closest(".file");
  if (fileCard) {
    select(Number(fileCard.dataset.i));
    return;
  }
  const tr = e.target.closest("tr");
  if (!tr) return;
  if (tr.dataset.up) { open(state.parent); return; }
  activate(Number(tr.dataset.i));
});

// Warm the cache for the directory under the pointer, so a click paints at once.
ui.list.addEventListener("pointerover", e => {
  if (state.view !== "list") return;
  const tr = e.target.closest("tr[data-i]");
  if (!tr) return;
  const entry = state.rows && state.rows[Number(tr.dataset.i)];
  if (entry && entry.type === "dir") prefetch("/" + entry.path);
});

ui.crumbs.addEventListener("click", e => {
  const link = e.target.closest("a[data-go]");
  if (!link) return;
  e.preventDefault();
  open(link.dataset.go);
});

el("upBtn").onclick = () => { if (state.parent !== null) open(state.parent); };
el("treeBtn").onclick = () => ui.tree.classList.toggle("hidden");
el("themeBtn").onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("md-theme", next);
};

el("mode").addEventListener("click", e => {
  const btn = e.target.closest("button[data-mode]");
  if (!btn) return;
  state.mode = btn.dataset.mode;
  el("mode").querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
  if (state.view === "results") search();
});

[ui.glob, ui.regex, ui.case, ui.here].forEach(input =>
  input.addEventListener("change", () => { if (state.view === "results") search(); }));
ui.hidden.addEventListener("change", () => { if (state.view === "list") paintList(); });

// Typing filters the listing; Enter runs a real search over file contents.
let filterTimer;
ui.q.addEventListener("input", () => {
  if (state.view === "results") return;
  clearTimeout(filterTimer);
  filterTimer = setTimeout(() => {
    state.filter = ui.q.value.trim();
    paintList();
  }, 60);
});
ui.q.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); search(); }
  if (e.key === "Escape") {
    ui.q.value = "";
    state.filter = "";
    ui.q.blur();
    open(state.path);
  }
});

/* =============================== keyboard =============================== */

function currentEntry() {
  if (state.view === "list") return state.rows ? state.rows[state.selected] : null;
  const r = state.results ? state.results[state.selected] : null;
  return r ? { type: "file", url: r.url, name: r.name } : null;
}

function select(i) {
  const items = state.view === "list"
    ? (state.nodes && state.nodes.length ? state.nodes : [...ui.list.querySelectorAll("tbody tr[data-i]")])
    : [...ui.list.querySelectorAll(".file")];
  if (!items.length) return;
  state.selected = Math.max(0, Math.min(i, items.length - 1));
  items.forEach((node, k) => node.classList.toggle("sel", k === state.selected));
  items[state.selected].scrollIntoView({ block: "nearest" });
  if (ui.preview.classList.contains("on")) {
    const e = currentEntry();
    if (e) showPreview(e.url, e.name, e.type === "dir");
  }
}

function activate(i) {
  select(i);
  const e = currentEntry();
  if (!e) return;
  if (e.type === "dir") { open(e.url); return; }
  if (ui.preview.classList.contains("on")) showPreview(e.url, e.name, false);
  else location.href = previewable(e.url) ? e.url : e.url + "?raw=1";
}

addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); ui.q.focus(); ui.q.select(); return; }
  if (typing) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  switch (e.key) {
    case "j": case "ArrowDown": select(state.selected + 1); break;
    case "k": case "ArrowUp": select(state.selected <= 0 ? 0 : state.selected - 1); break;
    case "g": select(0); break;
    case "G": select(1e9); break;
    case "Enter": activate(state.selected < 0 ? 0 : state.selected); break;
    case "u": case "Backspace": if (state.parent !== null) open(state.parent); break;
    case "p": el("previewBtn").click(); break;
    case "r": listCache.clear(); treeCache.clear(); open(state.path, { force: true, replace: true }); break;
    case "Escape":
      if (state.view === "results") { ui.q.value = ""; state.filter = ""; open(state.path); }
      else hidePreview();
      break;
    default: return;
  }
  e.preventDefault();
});

/* =============================== startup =============================== */

// One request paints the listing and the whole sidebar. The listing response
// also reports whether ripgrep is available, so no health round trip is needed.
(async function start() {
  const q = readUrl();
  await open(state.path, { keepQuery: Boolean(q), replace: true });
  if (q) await search({ replace: true });
})();

// Back and forward walk the directories and searches already visited.
addEventListener("popstate", () => {
  const q = readUrl();
  if (q) search({ replace: true });
  else open(state.path, { replace: true });
});
</script>
</body>
