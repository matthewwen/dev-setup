# Markdown rendering.
#
# Included inside a `server { }` block. A browser navigation to a *.md file
# returns the viewer at html/md-viewer.html, which fetches the same path
# with ?raw=1 and renders it in the browser. Other clients get the raw bytes.
# See maps.conf for $render_page. Add ?raw=1 to read the source instead.

location = /__md/viewer.html {
    internal;
    alias @NGINX_DIR@/md-viewer.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control no-cache always;
}

# Shared Markdown renderer, loaded by the Markdown and notebook viewers.
location = /__md/render.js {
    alias @NGINX_DIR@/md-render.js;
    default_type application/javascript;
    charset utf-8;
    add_header Cache-Control no-cache always;
}

location ~* \.(md|markdown|mdx)$ {
    # text/plain keeps ?raw=1 readable in the browser. mime.types maps .md to
    # text/markdown, which the browser downloads instead, so override it here.
    types { text/plain md markdown mdx; }
    default_type text/plain;
    charset utf-8;
    add_header Content-Disposition inline always;
    add_header Cache-Control no-store always;

    # The viewer sends a file it will not render whole here.
    if ($arg_view = "text") {
        rewrite ^ /__text/viewer.html last;
    }

    if ($render_page) {
        rewrite ^ /__md/viewer.html last;
    }
}
