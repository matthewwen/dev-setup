# Host-based routes such as http://docs.localhost/.
#
# Included directly inside the `http { }` block of /etc/nginx/nginx.conf.

server {
    listen 80;
    listen [::]:80;
    server_name docs.localhost;

    location / {
        proxy_pass http://127.0.0.1:8002;
        include /etc/nginx/proxy-dev.conf;
    }
}
