# Prompt library page. /prompts/ is not a path in the webroot, so without
# this `try_files` in nginx.conf answers 404. The app reads the route from
# location.pathname. Unlike the extension viewers, $render_page does not
# apply here: this prefix always renders the app.
#
# The trailing slash matters: `^~ /prompts` alone would also swallow
# /prompts.md and /prompts-old/. A webroot directory named `prompts` is
# shadowed by this and stays reachable at /__raw/prompts/.
#
# The API needs no location of its own. explorer.conf's `/__api/` proxy
# already forwards /__api/prompts/... to the service as /api/prompts/...
#
# Included inside a `server { }` block.

location = /prompts {
    return 301 /prompts/;
}

location ^~ /prompts/ {
    rewrite ^ /__app/index.html last;
}
