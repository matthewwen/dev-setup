# Shared maps for the file viewers.
#
# Included in the `http { }` block of /etc/nginx/nginx.conf.

# 1 when the client accepts HTML, which every browser navigation does.
map $http_accept $wants_html {
    default       0;
    "~*text/html" 1;
}

# 1 when a request is a page view that a viewer should render, 0 when the client
# wants the raw bytes. `?raw=1` always wins. Sec-Fetch-Mode identifies browser
# navigations; clients that omit it fall back to the Accept header.
map "$arg_raw:$http_sec_fetch_mode:$wants_html" $render_page {
    default       0;
    ":navigate:0" 1;
    ":navigate:1" 1;
    "::1"         1;
}
