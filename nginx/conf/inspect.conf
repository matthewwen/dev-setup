# Inspect AI (inspect_ai) log support.
#
# Included inside a `server { }` block. A browser navigation to a .eval file
# opens it in the Inspect log viewer. One shared copy of that viewer lives in
# /usr/share/nginx/inspect-view, written by `nginx/scripts/inspect.sh viewer`,
# and it deep-links any log through ?log_file=<path>.
#
# .eval files are zip archives that the viewer reads with HTTP range requests,
# which nginx answers natively for static files. Add ?raw=1 to download one.
#
# A log directory that already holds its own embedded viewer keeps serving that
# viewer, because the `index` directive in explorer.conf prefers index.html.

# The shared viewer. Not in git: the assets are a build artifact of inspect_ai.
location ^~ /__inspect/ {
    alias /usr/share/nginx/inspect-view/;
    add_header Cache-Control no-cache always;
    try_files $uri $uri/ @inspect_missing;
}

location @inspect_missing {
    default_type text/html;
    charset utf-8;
    return 200 '<!doctype html><meta charset="utf-8"><title>Inspect viewer missing</title><body style="font:14px/1.6 system-ui;padding:32px;max-width:44em"><h2>The Inspect log viewer is not installed</h2><p>Write the shared copy, then reload this page:</p><pre style="background:#f6f8fa;border:1px solid #d7dde3;border-radius:8px;padding:12px">nginx/scripts/inspect.sh viewer</pre><p>It needs <code>inspect_ai</code> on PATH.</p></body>';
}

# .eval logs stay binary, uncompressed, and inline so range requests hold.
location ~* \.eval$ {
    default_type application/octet-stream;
    gzip off;
    add_header Content-Disposition inline always;
    add_header Cache-Control no-store always;
    add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;

    if ($render_page) {
        return 302 /__inspect/?log_file=$uri;
    }
}

# listing.json, the log index written by `inspect view embed`, is served by
# json.conf. That block keeps fetch() on raw JSON and renders only navigations.
