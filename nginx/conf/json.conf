# JSON rendering.
#
# Included inside a `server { }` block, before inspect.conf so that this block
# owns .json. A browser navigation to a .json, .jsonl, or .ndjson file returns
# the viewer at /etc/nginx/json-viewer.html. Every other client, including
# fetch() from the Inspect viewer, gets the raw bytes.
#
# Add ?raw=1 to read the source.

location = /__json/viewer.html {
    internal;
    alias /etc/nginx/json-viewer.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control no-cache always;
}

location ~* \.(json|jsonl|ndjson)$ {
    types {
        application/json     json;
        application/x-ndjson jsonl ndjson;
    }
    default_type application/json;
    charset utf-8;
    add_header Content-Disposition inline always;
    add_header Cache-Control no-store always;

    # The viewer sends a file it will not render whole here.
    if ($arg_view = "text") {
        rewrite ^ /__text/viewer.html last;
    }

    if ($render_page) {
        rewrite ^ /__json/viewer.html last;
    }
}
