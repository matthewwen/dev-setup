# /etc/nginx/nginx.conf

user root;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/maps.conf;
    include /etc/nginx/hosts.conf;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    include /etc/nginx/mime.types;
    default_type text/plain;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /usr/share/nginx/html;

        # Send redirects as a path, never as http://host/path. nginx builds the
        # absolute form from $server_port, which drops the port when the site is
        # reached through a tunnel or another port.
        absolute_redirect off;

        include /etc/nginx/explorer.conf;
        include /etc/nginx/md.conf;
        include /etc/nginx/json.conf;
        include /etc/nginx/text.conf;
        include /etc/nginx/inspect.conf;

        location / {
            add_header Content-Disposition inline always;
            add_header Cache-Control no-store always;

            # A directory falls through to the `index` fallback in
            # explorer.conf, which serves the explorer for that path.
            try_files $uri $uri/ =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
        }
    }
}
