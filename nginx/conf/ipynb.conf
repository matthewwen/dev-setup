# Jupyter notebook rendering.
#
# Included inside a `server { }` block. A browser navigation to a *.ipynb file
# returns the viewer at html/ipynb-viewer.html, which fetches the same path
# with ?raw=1 and renders the cells in the browser. Other clients get the raw
# JSON. See maps.conf for $render_page. Add ?raw=1 to read the source.

location = /__ipynb/viewer.html {
    internal;
    alias @NGINX_DIR@/ipynb-viewer.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control no-cache always;
}

location ~* \.ipynb$ {
    # mime.types has no entry for .ipynb, so the browser would download it.
    types { application/json ipynb; }
    default_type application/json;
    charset utf-8;
    add_header Content-Disposition inline always;
    add_header Cache-Control no-store always;

    # The viewer sends a file it will not render whole here.
    if ($arg_view = "text") {
        rewrite ^ /__text/viewer.html last;
    }

    if ($render_page) {
        rewrite ^ /__ipynb/viewer.html last;
    }
}
