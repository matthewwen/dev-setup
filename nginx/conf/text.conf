# Buffered text viewing for large files.
#
# Included inside a `server { }` block, after md.conf and json.conf so those
# viewers keep their own extensions. A browser navigation to a log or plain text
# file returns the viewer at /etc/nginx/text-viewer.html, which reads the file in
# 256 KiB range requests instead of downloading all of it.
#
# Any path also opens in this viewer with ?view=text, which is how the Markdown
# and JSON viewers hand off a file that is too large to render whole.
#
# Add ?raw=1 to stream the bytes instead.

location = /__text/viewer.html {
    internal;
    alias /etc/nginx/text-viewer.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control no-cache always;
}

location ~* \.(log|txt|out|err|tsv|csv)$ {
    types {
        text/plain                log txt out err;
        text/tab-separated-values tsv;
        text/csv                  csv;
    }
    default_type text/plain;
    charset utf-8;
    add_header Content-Disposition inline always;
    add_header Cache-Control no-store always;

    if ($render_page) {
        rewrite ^ /__text/viewer.html last;
    }
}
