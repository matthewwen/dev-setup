# Markdown rendering.
#
# Included inside a `server { }` block. A browser navigation to a *.md file
# rewrites to the app shell, which fetches the same path with ?raw=1 and
# renders it. Other clients get the raw bytes. See maps.conf for $render_page.
# Add ?raw=1 to read the source instead.

location ~* \.(md|markdown|mdx)$ {
    # text/plain keeps ?raw=1 readable in the browser. mime.types maps .md to
    # text/markdown, which the browser downloads instead, so override it here.
    types { text/plain md markdown mdx; }
    default_type text/plain;
    charset utf-8;
    add_header Content-Disposition inline always;
    add_header Cache-Control no-store always;

    if ($render_page) {
        rewrite ^ /__app/index.html last;
    }
}
