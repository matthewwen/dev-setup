# Jupyter notebook rendering.
#
# Included inside a `server { }` block. A browser navigation to a *.ipynb file
# rewrites to the app shell, which fetches the same path with ?raw=1 and
# renders the cells. Other clients get the raw JSON. See maps.conf for
# $render_page. Add ?raw=1 to read the source.

location ~* \.ipynb$ {
    # mime.types has no entry for .ipynb, so the browser would download it.
    types { application/json ipynb; }
    default_type application/json;
    charset utf-8;
    add_header Content-Disposition inline always;
    add_header Cache-Control no-store always;

    if ($render_page) {
        rewrite ^ /__app/index.html last;
    }
}
