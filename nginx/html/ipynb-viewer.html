<!DOCTYPE html>
<!--
  Jupyter notebook viewer shim served by ipynb.conf.
  nginx rewrites a browser navigation to *.ipynb to this page. The page fetches
  the same path with ?raw=1, parses the notebook JSON, and renders cells:
  Markdown through the shared /__md/render.js, code with its highlighter, and
  outputs as text, HTML, or images. No network access and no third-party code.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notebook</title>
<script>
  // Set the theme before first paint so the page never flashes the wrong one.
  document.documentElement.dataset.theme = localStorage.getItem("md-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>&#128211;</text></svg>">
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --bg-soft: #f6f8fa;
  --bg-inset: #f0f3f6;
  --fg: #1f2328;
  --fg-muted: #636c76;
  --border: #d7dde3;
  --link: #0a58ca;
  --accent: #8250df;
  --quote: #57606a;
  --code-str: #0a7d36;
  --code-kw: #a626a4;
  --code-num: #b1560f;
  --code-com: #7b838b;
  --add: #1a7f37;
  --del: #cf222e;
  --shadow: 0 1px 3px rgba(27, 31, 36, .08);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
html[data-theme="dark"] {
  --bg: #0d1117;
  --bg-soft: #161b22;
  --bg-inset: #1c2128;
  --fg: #e6edf3;
  --fg-muted: #8b949e;
  --border: #30363d;
  --link: #6cb6ff;
  --accent: #d2a8ff;
  --quote: #9198a1;
  --code-str: #7ee787;
  --code-kw: #ff7b72;
  --code-num: #ffab70;
  --code-com: #768390;
  --add: #3fb950;
  --del: #ff7b72;
  --shadow: 0 1px 3px rgba(1, 4, 9, .6);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- chrome ---------- */
header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 20px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(180%) blur(8px);
  border-bottom: 1px solid var(--border);
}
#crumbs {
  flex: 1 1 auto; min-width: 0;
  font-family: var(--mono); font-size: 13px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--fg-muted);
}
#crumbs b { color: var(--fg); font-weight: 600; }
.btn {
  flex: 0 0 auto;
  padding: 4px 10px;
  font-size: 12px; font-family: var(--sans);
  color: var(--fg); background: var(--bg-soft);
  border: 1px solid var(--border); border-radius: 6px;
  cursor: pointer;
}
.btn:hover { background: var(--bg-inset); text-decoration: none; }

/* ---------- layout ---------- */
main { display: flex; gap: 32px; max-width: 1240px; margin: 0 auto; padding: 32px 20px 120px; }
#toc {
  flex: 0 0 220px; position: sticky; top: 76px; align-self: flex-start;
  max-height: calc(100vh - 120px); overflow-y: auto;
  font-size: 13px; line-height: 1.5;
  border-left: 1px solid var(--border); padding-left: 14px;
}
#toc.hidden { display: none; }
#toc div { color: var(--fg-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; margin-bottom: 8px; }
#toc a { display: block; padding: 3px 0; color: var(--fg-muted); }
#toc a:hover { color: var(--fg); text-decoration: none; }
#toc a.lvl3 { padding-left: 12px; }
#toc a.lvl4 { padding-left: 24px; font-size: 12px; }
#toc a.active { color: var(--link); font-weight: 600; }
article { flex: 1 1 auto; min-width: 0; max-width: 860px; }
main:has(#toc.hidden) article { margin: 0 auto; }

/* ---------- content ---------- */
article h1, article h2, article h3, article h4, article h5, article h6 {
  margin: 28px 0 14px; line-height: 1.3; font-weight: 600; scroll-margin-top: 76px;
}
article h1 { font-size: 2em; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-top: 0; }
article h2 { font-size: 1.5em; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
article h3 { font-size: 1.22em; }
article h4 { font-size: 1.05em; }
article h5, article h6 { font-size: 1em; color: var(--fg-muted); }
article .anchor { margin-left: 8px; color: var(--border); font-weight: 400; opacity: 0; }
article h1:hover .anchor, article h2:hover .anchor, article h3:hover .anchor,
article h4:hover .anchor, article h5:hover .anchor, article h6:hover .anchor { opacity: 1; }
article p { margin: 0 0 16px; }
article ul, article ol { margin: 0 0 16px; padding-left: 26px; }
article li { margin: 4px 0; }
article li > ul, article li > ol { margin: 4px 0; }
article li.task { list-style: none; margin-left: -20px; }
article li.task input { margin-right: 8px; }
article hr { height: 1px; margin: 28px 0; border: 0; background: var(--border); }
article blockquote {
  margin: 0 0 16px; padding: 2px 16px;
  color: var(--quote); border-left: 3px solid var(--border);
}
article blockquote > :last-child { margin-bottom: 0; }
article img { max-width: 100%; border-radius: 6px; }
article kbd {
  font-family: var(--mono); font-size: 11px; padding: 2px 5px;
  border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px;
  background: var(--bg-soft);
}
article code {
  font-family: var(--mono); font-size: 85%;
  padding: .2em .4em; border-radius: 5px; background: var(--bg-inset);
}
article pre {
  position: relative; margin: 0 0 16px; padding: 14px 16px;
  overflow-x: auto; background: var(--bg-soft);
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 13.5px; line-height: 1.55;
}
article pre code { padding: 0; background: none; font-size: 100%; }
article pre .lang {
  position: absolute; top: 0; right: 44px;
  padding: 1px 7px; font-family: var(--sans); font-size: 10px;
  letter-spacing: .05em; text-transform: uppercase;
  color: var(--fg-muted); background: var(--bg-inset);
  border-radius: 0 0 5px 5px;
}
article pre .copy {
  position: absolute; top: 6px; right: 6px; padding: 2px 7px;
  font-family: var(--sans); font-size: 11px; color: var(--fg-muted);
  background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
  cursor: pointer; opacity: 0; transition: opacity .12s;
}
article pre:hover .copy { opacity: 1; }
article table {
  display: block; width: max-content; max-width: 100%;
  margin: 0 0 16px; overflow-x: auto;
  border-collapse: collapse; font-size: 14px;
}
article th, article td { padding: 6px 13px; border: 1px solid var(--border); }
article th { background: var(--bg-soft); font-weight: 600; }
article tbody tr:nth-child(even) { background: var(--bg-soft); }
article .tok-str { color: var(--code-str); }
article .tok-kw { color: var(--code-kw); }
article .tok-num { color: var(--code-num); }
article .tok-com { color: var(--code-com); font-style: italic; }
article .diff-a { color: var(--add); }
article .diff-d { color: var(--del); }
article details {
  margin: 0 0 16px; padding: 10px 14px;
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px;
}
article summary { cursor: pointer; font-weight: 600; }
#frontmatter {
  margin: 0 0 24px; padding: 10px 14px;
  font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap;
  color: var(--fg-muted); background: var(--bg-soft);
  border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px;
}
#frontmatter.hidden { display: none; }
.error {
  padding: 16px; font-family: var(--mono); font-size: 13px;
  color: var(--del); background: var(--bg-soft);
  border: 1px solid var(--border); border-radius: 8px;
}
@media (max-width: 900px) { #toc { display: none; } main { padding-top: 24px; } }
@media print {
  header, #toc, .copy { display: none; }
  body { font-size: 11pt; }
  main { display: block; padding: 0; }
}

/* ---------- notebook ---------- */
#meta { margin: 0 0 20px; font-family: var(--mono); font-size: 12px; color: var(--fg-muted); }
.cell { display: flex; gap: 12px; margin: 0 0 14px; }
.gutter {
  flex: 0 0 64px; padding-top: 12px; text-align: right;
  font-family: var(--mono); font-size: 11.5px; color: var(--fg-muted); white-space: nowrap;
}
.cell.md .gutter { visibility: hidden; }
.cell-body { flex: 1 1 auto; min-width: 0; }
.cell.md .cell-body { padding: 4px 0; }
.cell.code pre { margin: 0; }
.outputs { margin: 6px 0 0; padding-left: 12px; border-left: 3px solid var(--border); }
.out { margin: 4px 0; overflow-x: auto; }
.out pre { margin: 0; padding: 6px 0; background: none; border: 0; font-size: 13px; }
.out.err pre { color: var(--del); }
.outlabel { font-family: var(--mono); font-size: 11px; color: var(--fg-muted); margin: 6px 0 2px; }
.out img { max-width: 100%; display: block; }
.out.html table { border-collapse: collapse; font-size: 13px; }
.out.html th, .out.html td { padding: 3px 10px; border: 1px solid var(--border); }
.out.html th { background: var(--bg-soft); }
</style>
</head>
<body>
<header>
  <div id="crumbs"></div>
  <button class="btn" id="tocBtn" title="Toggle contents">&#9776;</button>
  <button class="btn" id="themeBtn" title="Toggle theme">&#9788;</button>
  <a class="btn" id="rawBtn" title="View source">Raw</a>
</header>
<main>
  <nav id="toc" class="hidden"><div>Contents</div></nav>
  <article>
    <div id="meta"></div>
    <div id="body">Loading&hellip;</div>
  </article>
</main>
<script src="/__md/render.js"></script>
<script>
"use strict";

/* ============================ notebook renderer ============================ */

const text = v => Array.isArray(v) ? v.join("") : (v == null ? "" : String(v));
const ANSI = /\x1b\[[0-9;]*[A-Za-z]/g;

function notebookLanguage(nb) {
  const m = nb.metadata || {};
  return (m.kernelspec && m.kernelspec.language) || (m.language_info && m.language_info.name) || "python";
}

function renderNotebook(nb) {
  const lang = notebookLanguage(nb);
  return (Array.isArray(nb.cells) ? nb.cells : []).map(c => renderCell(c, lang)).join("\n");
}

function renderCell(c, lang) {
  const s = text(c.source);
  if (c.cell_type === "markdown") {
    return '<section class="cell md"><div class="gutter"></div><div class="cell-body">' +
      renderMarkdown(s).html + "</div></section>";
  }
  if (c.cell_type !== "code") {
    return '<section class="cell raw"><div class="gutter">raw</div><div class="cell-body"><pre><code>' +
      esc(s) + "</code></pre></div></section>";
  }
  const n = c.execution_count;
  let html = '<section class="cell code"><div class="gutter">In [' + (n == null ? " " : n) + ']</div><div class="cell-body">' +
    '<pre><button class="copy">copy</button><span class="lang">' + esc(lang) + "</span><code>" +
    highlight(s, lang) + "</code></pre>";
  const outs = (c.outputs || []).map(renderOutput).filter(Boolean);
  if (outs.length) html += '<div class="outputs">' + outs.join("") + "</div>";
  return html + "</div></section>";
}

function renderOutput(o) {
  switch (o.output_type) {
    case "stream":
      return '<div class="out' + (o.name === "stderr" ? " err" : "") + '"><pre>' + esc(text(o.text)) + "</pre></div>";
    case "error": {
      const tb = (o.traceback || []).join("\n").replace(ANSI, "");
      return '<div class="out err"><pre>' + esc(tb || (o.ename + ": " + o.evalue)) + "</pre></div>";
    }
    case "execute_result":
    case "display_data":
      return renderData(o.data || {}, o.execution_count);
    default:
      return "";
  }
}

const IMAGE_TYPES = ["image/png", "image/jpeg", "image/gif", "image/webp"];

function renderData(d, n) {
  const label = n != null ? '<div class="outlabel">Out [' + n + "]</div>" : "";
  if (d["text/html"]) return '<div class="out html">' + label + sanitize(text(d["text/html"])) + "</div>";
  for (const t of IMAGE_TYPES) {
    if (d[t]) return '<div class="out">' + label + '<img src="data:' + t + ";base64," + text(d[t]).replace(/\s/g, "") + '"></div>';
  }
  if (d["image/svg+xml"]) {
    return '<div class="out">' + label + '<img src="data:image/svg+xml;charset=utf-8,' +
      encodeURIComponent(text(d["image/svg+xml"])) + '"></div>';
  }
  if (d["text/markdown"]) return '<div class="out">' + label + renderMarkdown(text(d["text/markdown"])).html + "</div>";
  if (d["text/plain"] != null) return '<div class="out">' + label + "<pre>" + esc(text(d["text/plain"])) + "</pre></div>";
  return "";
}

// Notebook HTML outputs come from the kernel, so drop anything that runs code.
function sanitize(html) {
  if (typeof DOMParser === "undefined") return html;
  const doc = new DOMParser().parseFromString(html, "text/html");
  doc.querySelectorAll("script, iframe, object, embed, link, meta, base, form").forEach(el => el.remove());
  doc.querySelectorAll("*").forEach(el => {
    for (const a of [...el.attributes]) {
      if (/^on/i.test(a.name) || /^\s*javascript:/i.test(a.value)) el.removeAttribute(a.name);
    }
  });
  return doc.body.innerHTML;
}

/* ================================= page ================================= */

const path = decodeURIComponent(location.pathname);
const name = path.split("/").pop();
document.title = name;

(function crumbs() {
  const parts = path.split("/").filter(Boolean);
  const el = document.getElementById("crumbs");
  let acc = "";
  const bits = ['<a href="/">/</a>'];
  parts.forEach((p, k) => {
    acc += "/" + p;
    bits.push(k === parts.length - 1 ? "<b>" + esc(p) + "</b>" : '<a href="' + acc + '/">' + esc(p) + "</a>");
  });
  el.innerHTML = bits.join("<span> &rsaquo; </span>");
})();

document.getElementById("rawBtn").href = path + "?raw=1";

document.getElementById("themeBtn").onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("md-theme", next);
};

const tocEl = document.getElementById("toc");
document.getElementById("tocBtn").onclick = () => {
  tocEl.classList.toggle("hidden");
  localStorage.setItem("md-toc", tocEl.classList.contains("hidden") ? "0" : "1");
};

// Embedded images make notebooks large. Ask before parsing a very big one.
const BIG_BYTES = 8 * 1024 * 1024;

function tooBig(bytes) {
  document.getElementById("body").innerHTML =
    '<div class="error">This notebook is ' + (bytes / 1048576).toFixed(1) + " MiB.\n" +
    "Rendering it whole would block the page.\n\n" +
    '<a href="' + path + '?view=text">Open the buffered text viewer</a>  ·  ' +
    '<a href="' + path + '?raw=1">Raw</a>  ·  ' +
    '<a href="#" id="anyway">Render anyway</a></div>';
  document.getElementById("anyway").onclick = e => { e.preventDefault(); load(); };
}

fetch(path + "?raw=1", { method: "HEAD", cache: "no-store" })
  .then(r => {
    const size = Number(r.headers.get("Content-Length"));
    if (size > BIG_BYTES) tooBig(size);
    else load();
  })
  .catch(() => load());

function load() {
  fetch(path + "?raw=1", { cache: "no-store" })
  .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status + " " + r.statusText)))
  .then(nb => {
    const m = nb.metadata || {};
    const kernel = (m.kernelspec && m.kernelspec.display_name) || notebookLanguage(nb);
    const cells = Array.isArray(nb.cells) ? nb.cells.length : 0;
    document.getElementById("meta").textContent =
      kernel + " · " + cells + " cells · nbformat " + (nb.nbformat || "?") + "." + (nb.nbformat_minor || "?");
    document.getElementById("body").innerHTML = renderNotebook(nb);
    buildToc();
    wireCopy();
    if (location.hash) document.querySelector(decodeURIComponent(location.hash))?.scrollIntoView();
  })
  .catch(err => {
    document.getElementById("body").innerHTML =
      '<div class="error">Cannot load ' + esc(path) + "<br>" + esc(String(err.message || err)) +
      '<br><br><a href="' + path + '?view=text">Open the buffered text viewer</a></div>';
  });
}

function buildToc() {
  const shown = headings.filter(h => h.lvl >= 1 && h.lvl <= 3);
  if (shown.length < 3 || localStorage.getItem("md-toc") === "0") return;
  tocEl.insertAdjacentHTML("beforeend", shown.map(h =>
    '<a class="lvl' + (h.lvl + 1) + '" href="#' + h.id + '">' + esc(h.text) + "</a>").join(""));
  tocEl.classList.remove("hidden");
}

function wireCopy() {
  document.querySelectorAll("pre .copy").forEach(btn => {
    btn.onclick = () => {
      navigator.clipboard.writeText(btn.parentElement.querySelector("code").innerText).then(() => {
        btn.textContent = "copied";
        setTimeout(() => (btn.textContent = "copy"), 1200);
      });
    };
  });
}
</script>
</body>
</html>
